[package]
name = "inkubator-core"
version = "3.0.0-alpha.0"
description = "Data model, storage and import logic shared by the Inkubator desktop app and server."
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["net", "time"] }
url = "2"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
