name: Build Desktop Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify native runtime modules
        shell: bash
        run: |
          node -e "require('sharp'); console.log('sharp ok')"
          node -e "require('onnxruntime-node'); console.log('onnxruntime-node ok')"

      - name: Sync package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Detect signing availability
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signed=false
          reason="No signing secrets configured."

          if [[ "${{ matrix.target }}" == "mac" ]]; then
            if [[ -n "${CSC_LINK}" && -n "${CSC_KEY_PASSWORD}" && -n "${APPLE_ID}" && -n "${APPLE_APP_SPECIFIC_PASSWORD}" && -n "${APPLE_TEAM_ID}" ]]; then
              signed=true
              reason="macOS signing + notarization secrets found."
            else
              reason="Missing one or more macOS signing/notarization secrets."
            fi
          elif [[ "${{ matrix.target }}" == "win" ]]; then
            if [[ -n "${WIN_CSC_LINK}" && -n "${WIN_CSC_KEY_PASSWORD}" ]] || [[ -n "${CSC_LINK}" && -n "${CSC_KEY_PASSWORD}" ]]; then
              signed=true
              reason="Windows signing secrets found."
            else
              reason="Missing Windows signing secrets."
            fi
          else
            reason="Linux build runs unsigned in this workflow."
          fi

          echo "signed=${signed}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Build signed (${{ matrix.target }})
        if: steps.signing.outputs.signed == 'true'
        run: npm run build:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"

      - name: Build unsigned fallback (${{ matrix.target }})
        if: steps.signing.outputs.signed != 'true'
        run: npm run build:${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Install Flatpak toolchain (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak --system install -y flathub \
            org.freedesktop.Platform/x86_64/25.08 \
            org.freedesktop.Sdk/x86_64/25.08 \
            org.electronjs.Electron2.BaseApp/x86_64/25.08
          flatpak remotes --system --show-details
          flatpak list --system

      - name: Build Flatpak (Linux)
        if: matrix.target == 'linux'
        run: npm run build:linux:flatpak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder

      - name: Verify packaged showcase assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Packaged showcase asset files:"
          find dist -type f \( \
            -path '*/app.asar.unpacked/assets/icons/ink-drop-white-icon.png' -o \
            -path '*/app.asar.unpacked/assets/fonts/peachi.woff2' -o \
            -path '*/app.asar.unpacked/assets/fonts/inter/inter-latin-400-normal.woff2' -o \
            -path '*/app.asar.unpacked/assets/phosphor/Phosphor.woff2' -o \
            -path '*/app.asar.unpacked/assets/models/u2netp.onnx' \
          \) | sort

          if ! find dist -type f -path '*/app.asar.unpacked/assets/icons/ink-drop-white-icon.png' | grep -q .; then
            echo "Missing unpacked icon asset in packaged output." >&2
            exit 1
          fi

          if ! find dist -type f -path '*/app.asar.unpacked/assets/fonts/peachi.woff2' | grep -q .; then
            echo "Missing unpacked font asset in packaged output." >&2
            exit 1
          fi

          if ! find dist -type f -path '*/app.asar.unpacked/assets/fonts/inter/inter-latin-400-normal.woff2' | grep -q .; then
            echo "Missing unpacked Inter font asset in packaged output." >&2
            exit 1
          fi

          if ! find dist -type f -path '*/app.asar.unpacked/assets/phosphor/Phosphor.woff2' | grep -q .; then
            echo "Missing unpacked Phosphor icon font in packaged output." >&2
            exit 1
          fi

          if ! find dist -type f -path '*/app.asar.unpacked/assets/models/u2netp.onnx' | grep -q .; then
            echo "Missing unpacked pen color model in packaged output." >&2
            exit 1
          fi

      - name: Verify Linux desktop icon metadata
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          deb_file="$(find dist -maxdepth 1 -type f -name 'Inkubator-*-linux-amd64.deb' | head -n 1)"
          if [[ -z "${deb_file}" ]]; then
            echo "Missing Linux DEB artifact for desktop icon verification." >&2
            exit 1
          fi

          extract_dir="$(mktemp -d)"
          trap 'rm -rf "${extract_dir}"' EXIT

          dpkg-deb -x "${deb_file}" "${extract_dir}"

          desktop_file="${extract_dir}/usr/share/applications/inkubator.desktop"
          if [[ ! -f "${desktop_file}" ]]; then
            echo "Missing Linux desktop entry." >&2
            exit 1
          fi

          if ! grep -qx 'Icon=inkubator' "${desktop_file}"; then
            echo "Linux desktop entry does not reference the packaged inkubator icon." >&2
            cat "${desktop_file}" >&2
            exit 1
          fi

          for size in 16 24 32 48 64 128 256 512; do
            icon_path="${extract_dir}/usr/share/icons/hicolor/${size}x${size}/apps/inkubator.png"
            if [[ ! -f "${icon_path}" ]]; then
              echo "Missing Linux hicolor icon: ${icon_path}" >&2
              exit 1
            fi
          done

      - name: Remove blockmap sidecar files
        shell: bash
        run: |
          find dist -type f -name '*.blockmap' -delete

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: inkubator-${{ matrix.target }}
          path: dist/**
          if-no-files-found: error

      - name: Build mode summary
        run: |
          echo "Signed build: ${{ steps.signing.outputs.signed }}"
          echo "Reason: ${{ steps.signing.outputs.reason }}"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Remove stale release assets for current tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag
              });

              const assets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                {
                  ...context.repo,
                  release_id: release.id,
                  per_page: 100
                }
              );

              const staleAssets = assets.filter((asset) =>
                asset.name.startsWith('Inkubator-')
              );

              core.info(
                `Found ${staleAssets.length} existing Inkubator assets on ${tag}.`
              );

              for (const asset of staleAssets) {
                await github.rest.repos.deleteReleaseAsset({
                  ...context.repo,
                  asset_id: asset.id
                });
                core.info(`Deleted stale asset: ${asset.name}`);
              }
            } catch (error) {
              if (error.status === 404) {
                core.info(`No release exists yet for ${tag}; skipping stale asset cleanup.`);
              } else {
                throw error;
              }
            }

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: inkubator-*
          merge-multiple: true
          path: release-assets

      - name: Normalize Linux release filenames
        shell: bash
        run: |
          shopt -s globstar nullglob
          for file in release-assets/**/Inkubator-*-linux-amd64.deb; do
            mv "$file" "${file/-linux-amd64.deb/-linux-x64.deb}"
          done
          for file in release-assets/**/Inkubator-*-linux-x86_64.rpm; do
            mv "$file" "${file/-linux-x86_64.rpm/-linux-x64.rpm}"
          done
          for file in release-assets/**/Inkubator-*-linux-x86_64.flatpak; do
            mv "$file" "${file/-linux-x86_64.flatpak/-linux-x64.flatpak}"
          done

      - name: Remove generic Windows installer artifact
        shell: bash
        run: |
          shopt -s globstar nullglob
          for file in release-assets/**/Inkubator-*-win.exe; do
            if [[ "$file" != *"-win-x64.exe" && "$file" != *"-win-arm64.exe" ]]; then
              rm -f "$file"
            fi
          done

      - name: List downloadable files
        run: |
          echo "Collected files:"
          find release-assets -type f | sort

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/Inkubator-*
          fail_on_unmatched_files: true
          overwrite_files: true
