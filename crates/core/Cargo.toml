[package]
name = "inkubator-core"
version = "3.0.0-rc.9"
description = "Data model, storage and import logic shared by the Inkubator desktop app and server."
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
# The `ring` crypto backend builds from plain C on every target, including the
# static Linux (musl) and Windows release builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["net", "time"] }
url = "2"
urlencoding = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
webp = { version = "0.3.1", default-features = false }
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }

[features]
# Generates TypeScript types for the web interface.
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["macros", "rt"] }
