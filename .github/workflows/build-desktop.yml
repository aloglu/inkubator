name: Build Desktop Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            artifact: win-x64
            build_script: build:win
          - os: windows-11-arm
            platform: win
            arch: arm64
            artifact: win-arm64
            build_script: build:win
          - os: macos-15-intel
            platform: mac
            arch: x64
            artifact: mac-x64
            build_script: build:mac
          - os: macos-15
            platform: mac
            arch: arm64
            artifact: mac-arm64
            build_script: build:mac
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64
            build_script: build:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            rpm

      - name: Install dependencies
        run: npm ci

      - name: Sync package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm run sync-version -- "$VERSION"

      - name: Run JavaScript tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri bundle (${{ matrix.artifact }})
        run: npm run ${{ matrix.build_script }} -- --ci

      - name: Normalize release filenames
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          version="$(node -p "require('./package.json').version")"
          mkdir -p release-assets

          case "${{ matrix.platform }}" in
            win)
              for file in src-tauri/target/release/bundle/nsis/*.exe; do
                cp "$file" "release-assets/Inkubator-${version}-win-${{ matrix.arch }}.exe"
              done
              ;;
            mac)
              for file in src-tauri/target/release/bundle/dmg/*.dmg; do
                cp "$file" "release-assets/Inkubator-${version}-mac-${{ matrix.arch }}.dmg"
              done
              if compgen -G "src-tauri/target/release/bundle/macos/*.app" > /dev/null; then
                ditto -c -k --sequesterRsrc --keepParent \
                  src-tauri/target/release/bundle/macos/*.app \
                  "release-assets/Inkubator-${version}-mac-${{ matrix.arch }}.zip"
              fi
              ;;
            linux)
              for file in src-tauri/target/release/bundle/deb/*.deb; do
                cp "$file" "release-assets/Inkubator-${version}-linux-${{ matrix.arch }}.deb"
              done
              for file in src-tauri/target/release/bundle/rpm/*.rpm; do
                cp "$file" "release-assets/Inkubator-${version}-linux-${{ matrix.arch }}.rpm"
              done
              ;;
          esac

          if ! find release-assets -type f -name 'Inkubator-*' | grep -q .; then
            echo "No normalized release assets were produced." >&2
            find src-tauri/target/release/bundle -type f | sort >&2 || true
            exit 1
          fi

      - name: Verify Linux desktop icon metadata
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          deb_file="$(find release-assets -maxdepth 1 -type f -name 'Inkubator-*-linux-x64.deb' | head -n 1)"
          if [[ -z "${deb_file}" ]]; then
            echo "Missing Linux DEB artifact for desktop icon verification." >&2
            exit 1
          fi

          extract_dir="$(mktemp -d)"
          trap 'rm -rf "${extract_dir}"' EXIT

          dpkg-deb -x "${deb_file}" "${extract_dir}"

          desktop_file="$(find "${extract_dir}/usr/share/applications" -maxdepth 1 -type f -name '*.desktop' | head -n 1)"
          if [[ ! -f "${desktop_file}" ]]; then
            echo "Missing Linux desktop entry." >&2
            exit 1
          fi

          if ! grep -q '^Icon=inkubator' "${desktop_file}"; then
            echo "Linux desktop entry does not reference the packaged inkubator icon." >&2
            cat "${desktop_file}" >&2
            exit 1
          fi

          if ! find "${extract_dir}/usr/share/icons/hicolor" -type f -name 'inkubator.png' | grep -q .; then
            echo "Missing Linux hicolor app icon." >&2
            find "${extract_dir}/usr/share/icons" -type f | sort >&2 || true
            exit 1
          fi

      - name: List downloadable files
        shell: bash
        run: |
          echo "Collected files:"
          find release-assets -type f | sort

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: inkubator-${{ matrix.artifact }}
          path: release-assets/**
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Remove stale release assets for current tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag
              });

              const assets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                {
                  ...context.repo,
                  release_id: release.id,
                  per_page: 100
                }
              );

              const staleAssets = assets.filter((asset) =>
                asset.name.startsWith('Inkubator-')
              );

              core.info(`Found ${staleAssets.length} existing Inkubator assets on ${tag}.`);

              for (const asset of staleAssets) {
                await github.rest.repos.deleteReleaseAsset({
                  ...context.repo,
                  asset_id: asset.id
                });
                core.info(`Deleted stale asset: ${asset.name}`);
              }
            } catch (error) {
              if (error.status === 404) {
                core.info(`No release exists yet for ${tag}; skipping stale asset cleanup.`);
              } else {
                throw error;
              }
            }

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: inkubator-*
          merge-multiple: true
          path: release-assets

      - name: List release files
        shell: bash
        run: |
          echo "Collected files:"
          find release-assets -type f | sort

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/Inkubator-*
          fail_on_unmatched_files: true
          overwrite_files: true
