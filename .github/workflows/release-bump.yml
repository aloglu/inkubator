name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and commit
        id: bump_version
        run: |
          NEW_TAG="$(npm version ${{ github.event.inputs.bump }} --no-git-tag-version)"
          VERSION="${NEW_TAG#v}"
          npm run sync-version -- "$VERSION"
          npm run check:version -- "$VERSION"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json packaging/arch/PKGBUILD
          git commit -m "chore(release): v${VERSION}"
          echo "new_tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Push version bump commit
        run: git push

      - name: Summary
        run: |
          echo "Pushed the version bump commit for ${{ steps.bump_version.outputs.new_tag }}."
          echo "Review that commit, then create and push ${{ steps.bump_version.outputs.new_tag }} manually."
          echo "The manual tag push will trigger the desktop and Docker release workflows."
