name: Build Desktop Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            artifact: win-x64
            build_script: build:win
          - os: windows-11-arm
            platform: win
            arch: arm64
            artifact: win-arm64
            build_script: build:win
          - os: macos-15-intel
            platform: mac
            arch: x64
            artifact: mac-x64
            build_script: build:mac
          - os: macos-15
            platform: mac
            arch: arm64
            artifact: mac-arm64
            build_script: build:mac
          - os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64
            build_script: build:linux

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Install Linux Tauri prerequisites
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            rpm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            npm run check:version -- "${GITHUB_REF_NAME#v}"
          else
            npm run check:version
          fi

      - name: Run JavaScript tests
        run: npm test

      - name: Check JavaScript syntax
        if: matrix.platform == 'linux'
        run: npm run check:syntax

      - name: Run renderer workflow
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          chromium_bin="${CHROME_BIN:-}"
          if [[ -z "${chromium_bin}" || ! -x "${chromium_bin}" ]]; then
            chromium_bin="$(command -v google-chrome || command -v chromium)"
          fi
          "${chromium_bin}" --version
          INKUBATOR_CHROMIUM_BIN="${chromium_bin}" npm run test:renderer

      - name: Check Rust formatting
        if: matrix.platform == 'linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust Clippy
        if: matrix.platform == 'linux'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri bundle (${{ matrix.artifact }})
        run: npm run ${{ matrix.build_script }} -- --ci

      - name: Normalize release filenames
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          version="$(node -p "require('./package.json').version")"
          required_files=()
          rm -rf release-assets
          mkdir -p release-assets

          case "${{ matrix.platform }}" in
            win)
              for file in src-tauri/target/release/bundle/nsis/*.exe; do
                cp "$file" "release-assets/Inkubator-${version}-win-${{ matrix.arch }}.exe"
              done
              required_files=(
                "release-assets/Inkubator-${version}-win-${{ matrix.arch }}.exe"
              )
              ;;
            mac)
              for file in src-tauri/target/release/bundle/dmg/*.dmg; do
                cp "$file" "release-assets/Inkubator-${version}-mac-${{ matrix.arch }}.dmg"
              done
              if compgen -G "src-tauri/target/release/bundle/macos/*.app" > /dev/null; then
                ditto -c -k --sequesterRsrc --keepParent \
                  src-tauri/target/release/bundle/macos/*.app \
                  "release-assets/Inkubator-${version}-mac-${{ matrix.arch }}.zip"
              fi
              required_files=(
                "release-assets/Inkubator-${version}-mac-${{ matrix.arch }}.dmg"
                "release-assets/Inkubator-${version}-mac-${{ matrix.arch }}.zip"
              )
              ;;
            linux)
              for file in src-tauri/target/release/bundle/deb/*.deb; do
                cp "$file" "release-assets/Inkubator-${version}-linux-${{ matrix.arch }}.deb"
              done
              for file in src-tauri/target/release/bundle/rpm/*.rpm; do
                cp "$file" "release-assets/Inkubator-${version}-linux-${{ matrix.arch }}.rpm"
              done
              required_files=(
                "release-assets/Inkubator-${version}-linux-${{ matrix.arch }}.deb"
                "release-assets/Inkubator-${version}-linux-${{ matrix.arch }}.rpm"
              )
              ;;
          esac

          for required_file in "${required_files[@]}"; do
            if [[ ! -f "${required_file}" ]]; then
              echo "Missing required release artifact: ${required_file}" >&2
              find src-tauri/target/release/bundle -type f | sort >&2 || true
              exit 1
            fi
          done

      - name: Verify Linux desktop icon metadata
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          deb_file="$(find release-assets -maxdepth 1 -type f -name 'Inkubator-*-linux-x64.deb' | head -n 1)"
          if [[ -z "${deb_file}" ]]; then
            echo "Missing Linux DEB artifact for desktop icon verification." >&2
            exit 1
          fi

          extract_dir="$(mktemp -d)"
          trap 'rm -rf "${extract_dir}"' EXIT

          dpkg-deb -x "${deb_file}" "${extract_dir}"

          desktop_file="$(find "${extract_dir}/usr/share/applications" -maxdepth 1 -type f -name '*.desktop' | head -n 1)"
          if [[ ! -f "${desktop_file}" ]]; then
            echo "Missing Linux desktop entry." >&2
            exit 1
          fi

          if ! grep -q '^Icon=inkubator' "${desktop_file}"; then
            echo "Linux desktop entry does not reference the packaged inkubator icon." >&2
            cat "${desktop_file}" >&2
            exit 1
          fi

          if ! find "${extract_dir}/usr/share/icons/hicolor" -type f -name 'inkubator.png' | grep -q .; then
            echo "Missing Linux hicolor app icon." >&2
            find "${extract_dir}/usr/share/icons" -type f | sort >&2 || true
            exit 1
          fi

      - name: List downloadable files
        shell: bash
        run: |
          echo "Collected files:"
          find release-assets -type f | sort

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: inkubator-${{ matrix.artifact }}
          path: release-assets/**
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: inkubator-*
          merge-multiple: true
          path: release-assets

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          required_files=(
            "Inkubator-${version}-win-x64.exe"
            "Inkubator-${version}-win-arm64.exe"
            "Inkubator-${version}-mac-x64.dmg"
            "Inkubator-${version}-mac-x64.zip"
            "Inkubator-${version}-mac-arm64.dmg"
            "Inkubator-${version}-mac-arm64.zip"
            "Inkubator-${version}-linux-x64.deb"
            "Inkubator-${version}-linux-x64.rpm"
          )

          for required_file in "${required_files[@]}"; do
            match_count="$(find release-assets -type f -name "${required_file}" -size +0c | wc -l)"
            if [[ "${match_count}" -ne 1 ]]; then
              echo "Expected one non-empty ${required_file}, found ${match_count}." >&2
              find release-assets -type f | sort >&2
              exit 1
            fi
          done

          artifact_count="$(find release-assets -type f -name 'Inkubator-*' | wc -l)"
          if [[ "${artifact_count}" -ne "${#required_files[@]}" ]]; then
            echo "Expected ${#required_files[@]} Inkubator release files, found ${artifact_count}." >&2
            find release-assets -type f | sort >&2
            exit 1
          fi

          echo "Collected files:"
          find release-assets -type f | sort

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/**/Inkubator-*
          fail_on_unmatched_files: true
          overwrite_files: true
