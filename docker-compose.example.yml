# Inkubator with Docker Compose. Copy this file to docker-compose.yml, choose a
# password below (or in a .env file next to it), then run: docker compose up -d
# The full guide is in docs/docker.md.
services:
  inkubator:
    image: ghcr.io/aloglu/inkubator:latest
    container_name: inkubator
    restart: unless-stopped
    ports:
      # 127.0.0.1 means only this computer can open Inkubator. To use it from
      # your phone or other devices at home, set INKUBATOR_BIND_ADDRESS=0.0.0.0.
      - "${INKUBATOR_BIND_ADDRESS:-127.0.0.1}:${INKUBATOR_HOST_PORT:-8080}:8080"
    environment:
      INKUBATOR_ADMIN_USER: ${INKUBATOR_ADMIN_USER:-admin}
      INKUBATOR_ADMIN_PASSWORD: "${INKUBATOR_ADMIN_PASSWORD:?Set INKUBATOR_ADMIN_PASSWORD before starting Inkubator}"
      # The user that owns your data (on Unraid: 99 and 100).
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      # Your collection, photos and backups live in this folder.
      - ./inkubator-data:/data
