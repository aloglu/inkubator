[package]
name = "inkubator"
version = "2.1.0"
description = "Local-first desktop application for fountain pen and ink collections."
authors = ["Abdullah Aloğlu <contact@alog.lu>"]
edition = "2021"
license = "MIT"

[lib]
name = "inkubator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.103"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = true }
open = "5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1", features = ["net", "time"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
