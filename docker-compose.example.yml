services:
  inkubator:
    image: ghcr.io/aloglu/inkubator:2.0
    container_name: inkubator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      INKUBATOR_ADMIN_USER: admin
      INKUBATOR_ADMIN_PASSWORD: change-this-password
      INKUBATOR_DATA_DIR: /data
    volumes:
      - ./inkubator-data:/data
